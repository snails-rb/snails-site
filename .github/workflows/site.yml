name: site

# One workflow builds the site, checks the artifact, and deploys that same
# artifact to Cloudflare Workers. Cloudflare only serves the files; the build
# stays in Actions so Ruby and YARD have one pinned environment.
#
# `wrangler` is pinned in package-lock. The custom domain is attached in the
# Workers dashboard, not here, so the token only needs Worker write access.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Ruby comes from .ruby-version, so the runner and the local shell read
      # the same pin.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: bin/build-api --check

      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
